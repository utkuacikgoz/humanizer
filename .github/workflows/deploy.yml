name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gates a live paid-SaaS deploy behind GitHub Environment protection.
    # Configure required reviewers under Settings > Environments > production,
    # and scope the Cloudflare secrets to that environment (SEC finding:
    # plain repo secrets let any write-access collaborator deploy to prod).
    environment: production
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_STARTER: ${{ secrets.STRIPE_PRICE_STARTER }}
      # One secret per purchasable plan in src/config/stripe.ts
      # (STRIPE_PRICE_ENV_KEYS). Adding a plan there without adding its
      # secret here fails the deploy at the gate below rather than shipping
      # a Worker that cannot price it.
      STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
      PREVIEW_GUARD_SECRET: ${{ secrets.PREVIEW_GUARD_SECRET }}
      # Magic-link sign-in. Without it nobody can sign in, so nobody can pay:
      # src/lib/magic-link.ts fails closed with a console.error rather than
      # pretending a link was sent.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # M4-01. The humanization engine's model provider. The Worker only
      # calls Claude when HUMANIZATION_PROVIDER is explicitly set to
      # "claude"; without the key that selection fails closed onto the
      # deterministic engine (src/lib/humanization/provider-config.ts), so a
      # deploy that loses this secret silently downgrades every rewrite
      # rather than erroring — which is exactly why it gates below.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional, and deliberately not gated: absent means "deterministic",
      # which is a valid configuration.
      HUMANIZATION_PROVIDER: ${{ secrets.HUMANIZATION_PROVIDER }}
      # Optional. The single-model serving model; absent keeps the provider's
      # default (claude-opus-5). The 2026-08-30 measurement priced Sonnet 5 at
      # low effort at 78.8% worst-case gross margin, so a production flip is
      # expected to set this to claude-sonnet-5. An unrecognised value fails
      # closed to deterministic with a logged reason (provider-config.ts).
      HUMANIZATION_MODEL: ${{ secrets.HUMANIZATION_MODEL }}
      # Optional. Defaults to no-reply@<configured domain>; set it only when
      # the verified sending identity differs (e.g. a mail subdomain).
      AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      # SEC-08. `npm ci` executes third-party lifecycle scripts, and this job's
      # environment is the application's ENTIRE production credential set —
      # the Cloudflare deploy token, the live Stripe key, the webhook secret,
      # the preview guard's HMAC/encryption key, the mail credential and the
      # Anthropic key. One compromised transitive dependency reads all of them
      # in a single `process.env` access. Two changes narrow that to nothing:
      #
      #   * `--ignore-scripts`, so no dependency's install script runs at all.
      #     Seven of 654 lockfile packages declare one today — esbuild (three
      #     copies), workerd, and fsevents (two copies, macOS-only). None is
      #     needed: esbuild and workerd both ship their platform binary in a
      #     separate optional package and resolve it at runtime, and the
      #     install script only swaps the JS launcher for the native one as a
      #     startup optimisation. Verified: a clean `npm ci --ignore-scripts`
      #     builds and passes the full suite. If a future dependency genuinely
      #     needs its script, rebuild THAT package by name here — do not drop
      #     this flag and re-enable all 654.
      #
      #   * Every job-level credential blanked for this one step. Step `env`
      #     overrides job `env`, so an install script that reads any of these
      #     names gets an empty string. The names stay at job scope because the
      #     `if:` gates on the deploy steps below are written against them.
      - run: npm ci --ignore-scripts
        env:
          CF_API_TOKEN: ""
          CF_ACCOUNT_ID: ""
          CF_D1_ID: ""
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
          STRIPE_PRICE_STARTER: ""
          STRIPE_PRICE_PRO: ""
          PREVIEW_GUARD_SECRET: ""
          RESEND_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          HUMANIZATION_PROVIDER: ""
          HUMANIZATION_MODEL: ""
          AUTH_EMAIL_FROM: ""

      - name: Resolve the account that owns D1
        if: ${{ env.CF_API_TOKEN != '' && env.CF_D1_ID != '' }}
        run: |
          configured_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$CF_D1_ID" \
            --header "Authorization: Bearer $CF_API_TOKEN")"
          if [ "$configured_status" = "200" ]; then
            exit 0
          fi

          accounts="$(curl --fail-with-body --silent --show-error \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50' \
            --header "Authorization: Bearer $CF_API_TOKEN")"
          resolved=""
          while IFS= read -r account_id; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database/$CF_D1_ID" \
              --header "Authorization: Bearer $CF_API_TOKEN")"
            if [ "$status" = "200" ]; then
              resolved="$account_id"
              break
            fi
          done < <(printf '%s' "$accounts" | jq -r '.result[].id')

          if [ -z "$resolved" ]; then
            echo "::error::The Cloudflare token cannot access the configured D1 database in any visible account. Replace the token or D1 database ID."
            exit 1
          fi
          echo "CF_ACCOUNT_ID=$resolved" >> "$GITHUB_ENV"

      # vinext generates dist/server/wrangler.json from vite.config.ts,
      # baking in D1_DATABASE_ID (see vite.config.ts).
      - run: npm run build
        env:
          D1_DATABASE_ID: ${{ env.CF_D1_ID }}

      # Manual-trigger only: production remains an explicit release action.
      # SEC-07: `wrangler deploy` does NOT apply D1 migrations. Without this
      # step a fresh production database has no tables, every persistence
      # call fails, and no customer can complete a purchase. Runs before the
      # deploy so the schema is in place when the new code goes live.
      - name: Apply D1 migrations
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_D1_ID != '' }}
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      # `--secrets-file` REPLACES the Worker's entire secret set. Every secret
      # the running Worker needs must be in this one file, or the next deploy
      # silently wipes it.
      - name: Deploy via wrangler
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.CF_D1_ID != '' && env.STRIPE_SECRET_KEY != '' && env.STRIPE_WEBHOOK_SECRET != '' && env.STRIPE_PRICE_STARTER != '' && env.STRIPE_PRICE_PRO != '' && env.PREVIEW_GUARD_SECRET != '' && env.RESEND_API_KEY != '' && env.ANTHROPIC_API_KEY != '' }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/ownword.secrets"
          trap 'rm -f "$secrets_file"' EXIT
          printf '%s\n' \
            "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" \
            "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" \
            "STRIPE_PRICE_STARTER=$STRIPE_PRICE_STARTER" \
            "STRIPE_PRICE_PRO=$STRIPE_PRICE_PRO" \
            "PREVIEW_GUARD_SECRET=$PREVIEW_GUARD_SECRET" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" > "$secrets_file"
          if [ -n "$AUTH_EMAIL_FROM" ]; then
            printf '%s\n' "AUTH_EMAIL_FROM=$AUTH_EMAIL_FROM" >> "$secrets_file"
          fi
          if [ -n "$HUMANIZATION_PROVIDER" ]; then
            printf '%s\n' "HUMANIZATION_PROVIDER=$HUMANIZATION_PROVIDER" >> "$secrets_file"
          fi
          if [ -n "$HUMANIZATION_MODEL" ]; then
            printf '%s\n' "HUMANIZATION_MODEL=$HUMANIZATION_MODEL" >> "$secrets_file"
          fi
          npx wrangler deploy --config dist/server/wrangler.json --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Not configured
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' || env.CF_D1_ID == '' || env.STRIPE_SECRET_KEY == '' || env.STRIPE_WEBHOOK_SECRET == '' || env.STRIPE_PRICE_STARTER == '' || env.STRIPE_PRICE_PRO == '' || env.PREVIEW_GUARD_SECRET == '' || env.RESEND_API_KEY == '' || env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "::error::Set the Cloudflare, Stripe, PREVIEW_GUARD_SECRET, RESEND_API_KEY, and ANTHROPIC_API_KEY repository secrets before running this workflow."
          exit 1
