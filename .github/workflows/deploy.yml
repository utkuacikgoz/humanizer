name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - run: npm ci

      - run: npm run build

      # Manual-trigger only (no push/merge auto-deploy): this repo's deploy
      # target is a project_id-tied hosting platform (.openai/hosting.json)
      # whose own deploy mechanism is unconfirmed. Auto-deploying here could
      # double-fire against it. No wrangler.toml exists yet either — add one
      # with real D1/R2 IDs before this step can run for real.
      - name: Deploy via wrangler
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Not configured
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: |
          echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets, and add a wrangler.toml with real D1/R2 IDs, before running this workflow."
          exit 1
